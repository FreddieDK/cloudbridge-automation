[dc_core]
DC01-SW-CORE01 ansible_host=172.20.20.1
DC01-SW-CORE02 ansible_host=172.20.20.2
 
[dc_distribution]
DC01-SW-DIST01 ansible_host=172.20.2.2
DC01-SW-DIST02 ansible_host=172.20.2.3
 
[dc_access]
DC01-SW-ACCS01 ansible_host=172.20.2.4
# DC01-SW-ACCS02 - temporarily excluded: IOS only supports SHA-1 for SSH (kex + MAC).
# To be re-added after IOS upgrade/replacement. Backups are taken manually until then.
# DC01-SW-ACCS02 ansible_host=172.20.2.5
 
[switches:children]
dc_core
dc_distribution
dc_access
 
[switches:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_network_cli_ssh_type=libssh
ansible_command_timeout=60
ansible_host_key_checking=false
